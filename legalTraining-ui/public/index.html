<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#541914">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <link rel="preload" as="image" href="<%= BASE_URL %>exhibition-hall.webp">
  <title><%= webpackConfig.name %></title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    :root {
      --lt-exhibition-hall: url('<%= BASE_URL %>exhibition-hall.webp');
      --lt-login-art: linear-gradient(180deg, #45110c60, transparent 28%, #3d100ec7 100%),
        #541914 var(--lt-exhibition-hall) center / cover no-repeat;
      --lt-login-background: #fff7ea;
      --lt-login-text: #471c15;
    }
    html, body, #app { height: 100%; margin: 0; padding: 0; }
    #loader-wrapper {
      display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
      min-height: 100vh; color: var(--lt-login-text); background: var(--lt-login-background);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .boot-art {
      display: flex; flex-direction: column; justify-content: space-between;
      padding: clamp(28px, 5vw, 76px); color: white; background: var(--lt-login-art);
    }
    .boot-mark {
      display: grid; place-items: center; width: 38px; height: 38px; box-sizing: border-box;
      border: 1px solid #e9d4b8; border-radius: 9px; color: #f4d9b4; font: 22px "Songti SC", SimSun, serif;
    }
    .boot-art h1 {
      margin: 15px 0 0; font: 700 clamp(38px, 5.4vw, 88px)/1.16 "Songti SC", "Noto Serif CJK SC", SimSun, serif;
    }
    .boot-content { display: grid; place-items: center; padding: 58px 32px 82px; }
    .boot-status { width: min(100%, 392px); }
    .boot-status h2 { margin: 0; font-size: clamp(27px, 3vw, 38px); font-weight: 750; letter-spacing: -.025em; }
    .boot-status p { margin: 10px 0 20px; color: #76574a; font-size: 14px; }
    .boot-track { height: 4px; overflow: hidden; border-radius: 999px; background: #eedac4; }
    .boot-track::before {
      content: ""; display: block; width: 40%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #8d3025, #d69d59); animation: boot-progress 1.5s ease-in-out infinite alternate;
    }
    @keyframes boot-progress { to { transform: translateX(150%); } }
    @media (prefers-reduced-motion: reduce) {
      .boot-track::before { animation: none; }
    }
    @media (max-width: 740px) {
      #loader-wrapper { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .boot-art { display: block; min-height: 188px; padding: 20px 24px; box-sizing: border-box; background-position: center 50%; }
      .boot-art h1 { display: none; }
      .boot-content { padding: 32px 22px 68px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <main id="loader-wrapper">
      <section class="boot-art" aria-label="法律实训数字平台">
        <span class="boot-mark" aria-hidden="true">法</span>
        <h1>法律实训<br>数字平台</h1>
      </section>
      <section class="boot-content">
        <div class="boot-status" role="status">
          <h2>管理后台</h2>
          <p>正在加载系统资源…</p>
          <div class="boot-track" aria-hidden="true"></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
